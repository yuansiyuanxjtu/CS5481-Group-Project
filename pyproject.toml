[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs5481-rag-ingest"
version = "0.1.0"
description = "Page-preserving PDF ingestion, embeddings, and persistent vector storage for CS5481"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.26.6", "transformers==4.57.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
phase2 = ["sentence-transformers==5.1.2", "chromadb==1.3.5"]

[project.scripts]
rag-ingest = "rag_ingest.cli:main"
rag-store = "rag_ingest.store_cli:main"
rag-benchmark = "rag_ingest.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
